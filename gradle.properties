# gradle.properties
#
# Настройки под сборку на устройстве с ограниченным RAM (см. обсуждение
# в чате — сборка идёт через AndroidIDE на 4 ГБ устройстве). Дефолтные
# Gradle-настройки рассчитаны на десктоп с 16+ ГБ и параллельными
# воркерами — на 4 ГБ это приводит к OOM killer'у, убивающему демон
# посреди сборки, что часто выглядит как непонятный "Daemon disappeared"
# без явной причины в логе.

# Ограничиваем heap самого Gradle-демона — дефолт может запросить больше,
# чем реально свободно после того, как система+IDE+прочие процессы уже
# заняли часть 4 ГБ. 1536m — компромисс: достаточно для Kotlin compiler
# daemon + AGP task graph, не настолько много, чтобы задушить остальное.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Параллельные module builds отключены — у нас всего один модуль (:app),
# от parallel=true тут нет пользы, зато при БУДУЩЕМ добавлении модулей
# он сразу начал бы плодить несколько JVM-процессов одновременно,
# каждый со своим -Xmx, что на 4 ГБ гарантированно даёт OOM.
org.gradle.parallel=false

# Configure on demand — экономит время конфигурации при единственном
# модуле, не даёт заметного выигрыша, но и не вредит.
org.gradle.configureondemand=true

# Kotlin compiler daemon отдельно от Gradle-демона — тоже держим heap
# в узде по той же причине, что и org.gradle.jvmargs выше.
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.nonTransitiveRClass=true
